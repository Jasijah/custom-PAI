[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pai-transfer-intents"
version = "0.1.0"
description = "Local PAI-to-PAI transfer intent simulator and agent skill"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
pai-transfer = "cli:main"

[tool.setuptools]
py-modules = ["transfers", "cli"]
